name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches:
    - main

# Cancel an in-flight run when a newer commit is pushed to the same ref, so a
# PR's ~50-job coverage fan-out doesn't pile up behind superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build kcov once into the shared cache and emit the test-file matrix. Building
  # kcov here (rather than in every matrix leg) means the ~50 coverage jobs all
  # restore a warm cache instead of racing to build kcov on a cold cache.
  prep:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v4
        with:
          path: ~/.kcov
          key: kcov-v43-${{ runner.os }}

      - name: Build and install kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libdw-dev libcurl4-openssl-dev
          wget -q https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz
          tar xzf v43.tar.gz
          cmake -S kcov-43 -B kcov-43/build -DCMAKE_INSTALL_PREFIX="${HOME}/.kcov"
          make -C kcov-43/build -j"$(nproc)"
          make -C kcov-43/build install
          rm -rf kcov-43 v43.tar.gz

      - name: List test files
        id: list
        run: echo "files=$(maint/list-test-files.sh)" >> "$GITHUB_OUTPUT"

  # One coverage job per test file: a single file per runner is inherently
  # memory-bounded (no shard balancing / -P cap needed), and a failure shows up
  # as a red job named after the file. Each job uploads its kcov output as an
  # artifact for the merge job to combine.
  coverage:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.prep.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats sqlite3 libdw-dev libcurl4-openssl-dev jq yq

      - name: Restore kcov
        uses: actions/cache/restore@v4
        with:
          path: ~/.kcov
          key: kcov-v43-${{ runner.os }}

      - name: Add kcov to PATH
        run: echo "${HOME}/.kcov/bin" >> "${GITHUB_PATH}"

      - name: Build knit.sh for coverage
        run: make coverage

      - name: Run one test file with coverage
        run: |
          # kcov creates the leaf output dir but not its parent, so make it.
          mkdir -p coverage
          kcov --include-path=src "coverage/${{ matrix.file }}" bats "tests/${{ matrix.file }}"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          # Artifact name == the test file; the merge job downloads each into
          # coverage/<file>/ and merges coverage/test_* (see below).
          name: ${{ matrix.file }}
          path: coverage/${{ matrix.file }}
          retention-days: 1

  # Merge every file's kcov output into one report and make a single Codecov
  # upload (repo-root codecov.yml therefore uses after_n_builds: 1, decoupled
  # from the file count). Also acts as the stable aggregate check for branch
  # protection: it fails if any coverage job failed.
  merge:
    needs: coverage
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kcov runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev libcurl4-openssl-dev

      - name: Restore kcov
        uses: actions/cache/restore@v4
        with:
          path: ~/.kcov
          key: kcov-v43-${{ runner.os }}

      - name: Add kcov to PATH
        run: echo "${HOME}/.kcov/bin" >> "${GITHUB_PATH}"

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          # Each artifact (named after its test file) lands in coverage/<file>/,
          # which is a kcov output directory; merge them all.
          path: coverage

      - name: Merge coverage
        run: kcov --merge coverage/merged coverage/test_*

      - name: Fix coverage paths
        run: |
          # kcov records <source> as an absolute path to src/ and filenames
          # as bare names (e.g. "log.sh"). Codecov needs paths relative to the
          # repo root (e.g. "src/log.sh"). Fix by setting <source> to the repo
          # root and prepending "src/" to each filename.
          xml=$(find coverage/merged -name cobertura.xml | head -1)
          sed -i "s|<source>.*</source>|<source>.</source>|" "$xml"
          sed -i 's|filename="\([^"]*\)"|filename="src/\1"|g' "$xml"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/merged/kcov-merged/cobertura.xml
          name: knit
          fail_ci_if_error: true

      - name: Verify all coverage jobs passed
        run: |
          [[ "${{ needs.coverage.result }}" == "success" ]] \
            || { echo "one or more coverage jobs failed"; exit 1; }
