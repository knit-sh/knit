name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches:
    - main

jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      # Shard the test suite across independent runners. Wall-clock is the
      # slowest shard, so more shards means a shorter run (at the cost of one
      # kcov setup per shard). SHARD_COUNT must equal the length of the matrix
      # AND codecov.notify.after_n_builds in the repo-root codecov.yml, so
      # Codecov waits for every shard's upload before finalizing the status.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARD_COUNT: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats sqlite3 libdw-dev libcurl4-openssl-dev jq yq

      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v4
        with:
          path: ~/.kcov
          key: kcov-v43-${{ runner.os }}

      - name: Build and install kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y cmake pkg-config
          wget -q https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz
          tar xzf v43.tar.gz
          cmake -S kcov-43 -B kcov-43/build -DCMAKE_INSTALL_PREFIX="${HOME}/.kcov"
          make -C kcov-43/build -j"$(nproc)"
          make -C kcov-43/build install
          rm -rf kcov-43 v43.tar.gz

      - name: Add kcov to PATH
        run: echo "${HOME}/.kcov/bin" >> "${GITHUB_PATH}"

      - name: Build knit.sh for coverage
        run: make coverage

      - name: Run tests with coverage
        run: |
          # This job is one shard of the coverage matrix; run only this shard's
          # test files (balanced across shards by test count).
          #
          # Within the shard, run kcov once per test file rather than once over
          # the whole subset. kcov's bash coverage (PS4 method) accumulates
          # ~45 MB of state per traced test inside a single process (and more for
          # subprocess-heavy suites, whose forked children are traced too), so a
          # single invocation over many tests grows unbounded and OOM-kills the
          # runner. Per-file invocation lets each kcov process free its memory
          # between files, bounding peak RSS to the largest single file.
          #
          # The per-file processes run in parallel with xargs -P, but peak RSS is
          # (concurrency x per-file RSS), so parallelism must be bounded by MEMORY,
          # not CPU: -P "$(nproc)" ran the shard's biggest files together and
          # exhausted the 16 GB runner. Budget ~6 GB per parallel kcov job and cap
          # at nproc; on a 16 GB / 4-core runner this yields -P 2, which keeps peak
          # RSS safe while still overlapping two files. It scales up automatically
          # on larger runners. xargs returns 123 if any invocation fails, so a
          # failing test still fails this step. The per-file results are merged,
          # then this shard's merged report is uploaded to Codecov, which combines
          # all shards for the commit.
          # kcov creates the leaf output dir but not its parent, so make it.
          mkdir -p coverage
          mem_gb=$(awk '/MemTotal/ {print int($2 / 1024 / 1024)}' /proc/meminfo)
          ncpu=$(nproc)
          jobs=$(( mem_gb / 6 ))
          # if-form (not `(( ... )) && ...`), which returns 1 when the condition
          # is false and would trip the step's `set -e`.
          if (( jobs < 1 )); then jobs=1; fi
          if (( jobs > ncpu )); then jobs=${ncpu}; fi
          echo "coverage concurrency: -P ${jobs} (MemTotal ${mem_gb} GB, nproc ${ncpu})"
          maint/coverage-shard.sh "${{ matrix.shard }}" "${SHARD_COUNT}" \
            | xargs -d '\n' -P "${jobs}" -n1 bash -c '
                t="$1"; name=$(basename "$t" .sh)
                echo "=== coverage: ${name} ==="
                kcov --include-path=src "coverage/${name}" bats "$t"
              ' _
          kcov --merge coverage/merged coverage/test_*

      - name: Fix coverage paths
        run: |
          # kcov records <source> as an absolute path to src/ and filenames
          # as bare names (e.g. "log.sh"). Codecov needs paths relative to the
          # repo root (e.g. "src/log.sh"). Fix by setting <source> to the repo
          # root and prepending "src/" to each filename.
          xml=$(find coverage/merged -name cobertura.xml | head -1)
          sed -i "s|<source>.*</source>|<source>.</source>|" "$xml"
          sed -i 's|filename="\([^"]*\)"|filename="src/\1"|g' "$xml"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/merged/kcov-merged/cobertura.xml
          # Distinct name per shard so Codecov treats these as separate uploads
          # for the same commit and merges them (line covered in any shard counts).
          name: shard-${{ matrix.shard }}
          fail_ci_if_error: true
