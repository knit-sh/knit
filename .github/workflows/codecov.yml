name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches:
    - main

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats sqlite3 libdw-dev libcurl4-openssl-dev jq

      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v4
        with:
          path: ~/.kcov
          key: kcov-v43-${{ runner.os }}

      - name: Build and install kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y cmake pkg-config
          wget -q https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz
          tar xzf v43.tar.gz
          cmake -S kcov-43 -B kcov-43/build -DCMAKE_INSTALL_PREFIX="${HOME}/.kcov"
          make -C kcov-43/build -j"$(nproc)"
          make -C kcov-43/build install
          rm -rf kcov-43 v43.tar.gz

      - name: Add kcov to PATH
        run: echo "${HOME}/.kcov/bin" >> "${GITHUB_PATH}"

      - name: Build knit.sh for coverage
        run: make coverage

      - name: Run tests with coverage
        run: |
          # Run kcov once per test file, not once over the whole suite. kcov's
          # bash coverage (PS4 method) accumulates ~45 MB of state per traced
          # test inside a single process; a single invocation over all ~950
          # tests grows to ~20 GB and OOM-kills the runner. Running per file lets
          # each kcov process exit and free its memory between files, bounding
          # peak RSS to the largest single file (~40 tests -> ~1.8 GB).
          #
          # The per-file processes are independent, so run them in parallel with
          # xargs -P. Parallelism is capped at nproc (4 on ubuntu-latest); with
          # the per-file memory bound above, peak RSS stays well under the
          # runner's 16 GB even in the worst case of nproc large files at once.
          # xargs returns 123 if any invocation fails, so a failing test still
          # fails this step. Results are merged afterwards.
          # kcov creates the leaf output dir but not its parent, so make it.
          mkdir -p coverage
          printf '%s\0' tests/test_*.sh | xargs -0 -P "$(nproc)" -n1 bash -c '
            t="$1"; name=$(basename "$t" .sh)
            echo "=== coverage: ${name} ==="
            kcov --include-path=src "coverage/${name}" bats "$t"
          ' _
          kcov --merge coverage/merged coverage/test_*

      - name: Fix coverage paths
        run: |
          # kcov records <source> as an absolute path to src/ and filenames
          # as bare names (e.g. "log.sh"). Codecov needs paths relative to the
          # repo root (e.g. "src/log.sh"). Fix by setting <source> to the repo
          # root and prepending "src/" to each filename.
          xml=$(find coverage/merged -name cobertura.xml | head -1)
          sed -i "s|<source>.*</source>|<source>.</source>|" "$xml"
          sed -i 's|filename="\([^"]*\)"|filename="src/\1"|g' "$xml"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/merged/kcov-merged/cobertura.xml
          fail_ci_if_error: true
