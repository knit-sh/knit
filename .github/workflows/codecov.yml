name: Code Coverage

on:
  push:
    branches: [main]
    paths:
    - "src/**"
    - Makefile
    - "tests/test_*.sh"
    - tests/setup_teardown.sh
    - maint/shard-test-files.sh
    - .github/workflows/codecov.yml
  pull_request:
    branches:
    - main
    paths:
    - "src/**"
    - Makefile
    - "tests/test_*.sh"
    - tests/setup_teardown.sh
    - maint/shard-test-files.sh
    - .github/workflows/codecov.yml

# Cancel an in-flight run when a newer commit is pushed to the same ref, so a
# PR's coverage fan-out doesn't pile up behind superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One place to tune the coverage fan-out. Coverage runs in a FIXED number of
# shards rather than one job per test file, so the number of uploaded artifacts
# (and therefore the burst of artifact-finalize calls to GitHub's backend) stays
# bounded as the test suite grows. Keep this comfortably below the test-file
# count; trailing shards are simply empty if it exceeds it.
env:
  COVERAGE_SHARDS: "16"

jobs:
  # Build kcov once into the shared cache and emit the shard index list. Building
  # kcov here (rather than in every matrix leg) means the coverage shards all
  # restore a warm cache instead of racing to build kcov on a cold cache.
  prep:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v5
        with:
          path: ~/.kcov
          key: kcov-v43-${{ runner.os }}

      - name: Build and install kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libdw-dev libcurl4-openssl-dev
          wget -q https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz
          tar xzf v43.tar.gz
          cmake -S kcov-43 -B kcov-43/build -DCMAKE_INSTALL_PREFIX="${HOME}/.kcov"
          make -C kcov-43/build -j"$(nproc)"
          make -C kcov-43/build install
          rm -rf kcov-43 v43.tar.gz

      - name: Emit shard index list
        id: list
        run: |
          echo "shards=$(jq -nc --argjson n "${COVERAGE_SHARDS}" '[range($n)]')" \
            >> "$GITHUB_OUTPUT"

  # One job per shard: run this shard's test files under kcov (one file at a time,
  # so peak memory stays a single file's run), merge them into one kcov output
  # directory, and upload a single artifact. The artifact count equals
  # COVERAGE_SHARDS, not the test-file count. A failure shows up as a red shard;
  # per-file pass/fail triage still lives in the Tests workflow.
  coverage:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats sqlite3 libdw-dev libcurl4-openssl-dev jq yq

      - name: Restore kcov
        uses: actions/cache/restore@v5
        with:
          path: ~/.kcov
          key: kcov-v43-${{ runner.os }}

      - name: Add kcov to PATH
        run: echo "${HOME}/.kcov/bin" >> "${GITHUB_PATH}"

      - name: Build knit.sh for coverage
        run: make coverage

      - name: Run this shard's test files with coverage
        run: |
          mkdir -p coverage
          files=$(maint/shard-test-files.sh "${{ matrix.shard }}" "${COVERAGE_SHARDS}")
          if [[ -z "${files}" ]]; then
            echo "shard ${{ matrix.shard }} has no files; nothing to do"
            exit 0
          fi
          # kcov creates the leaf output dir but not its parent, so make it above.
          for f in ${files}; do
            kcov --include-path=src "coverage/${f}" bats "tests/${f}"
          done
          # Merge this shard's per-file kcov dirs into one output dir; the merge
          # job then merges the per-shard dirs into the final report.
          kcov --merge "coverage/shard-${{ matrix.shard }}" coverage/test_*

      - name: Upload shard coverage artifact
        uses: actions/upload-artifact@v6
        with:
          # One artifact per shard. The merge job downloads each into
          # coverage/shard-<n>/ and merges coverage/shard-* (see below).
          name: shard-${{ matrix.shard }}
          path: coverage/shard-${{ matrix.shard }}
          # Empty shards (COVERAGE_SHARDS > file count) produce no directory;
          # don't fail the job over a missing upload in that case.
          if-no-files-found: ignore
          retention-days: 1

  # Merge every shard's kcov output into one report and make a single Codecov
  # upload (repo-root codecov.yml therefore uses after_n_builds: 1, decoupled
  # from the shard count). Also acts as the stable aggregate check for branch
  # protection: it fails if any coverage shard failed.
  merge:
    needs: coverage
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kcov runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev libcurl4-openssl-dev

      - name: Restore kcov
        uses: actions/cache/restore@v5
        with:
          path: ~/.kcov
          key: kcov-v43-${{ runner.os }}

      - name: Add kcov to PATH
        run: echo "${HOME}/.kcov/bin" >> "${GITHUB_PATH}"

      - name: Download coverage artifacts
        uses: actions/download-artifact@v7
        with:
          # Each shard artifact lands in coverage/shard-<n>/, a kcov output
          # directory; merge them all.
          pattern: shard-*
          path: coverage

      - name: Merge coverage
        run: kcov --merge coverage/merged coverage/shard-*

      - name: Fix coverage paths
        run: |
          # kcov records <source> as an absolute path to src/ and filenames
          # as bare names (e.g. "log.sh"). Codecov needs paths relative to the
          # repo root (e.g. "src/log.sh"). Fix by setting <source> to the repo
          # root and prepending "src/" to each filename.
          xml=$(find coverage/merged -name cobertura.xml | head -1)
          sed -i "s|<source>.*</source>|<source>.</source>|" "$xml"
          sed -i 's|filename="\([^"]*\)"|filename="src/\1"|g' "$xml"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/merged/kcov-merged/cobertura.xml
          name: knit
          fail_ci_if_error: true

      - name: Verify all coverage shards passed
        run: |
          [[ "${{ needs.coverage.result }}" == "success" ]] \
            || { echo "one or more coverage shards failed"; exit 1; }
