name: Docs Examples

on:
  push:
    branches: [main]
    paths:
    - "src/**"
    - Makefile
    - "docs/source/_code/**"
    - maint/check-docs.sh
    - .github/workflows/check-docs.yml
  pull_request:
    branches:
    - main
    paths:
    - "src/**"
    - Makefile
    - "docs/source/_code/**"
    - maint/check-docs.sh
    - .github/workflows/check-docs.yml

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3 jq

      - name: Build knit.sh
        run: make

      - name: Run documentation code examples
        run: make check-docs
        env:
          # Authenticate the GitHub downloads bootstrap performs (knit-graph, jq)
          # so many examples on one shared runner IP do not exhaust the low
          # anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
